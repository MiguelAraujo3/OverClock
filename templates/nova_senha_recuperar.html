{% extends "base.html" %}

{% block title %}Nova Senha - OverClock Barbearia{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/trocar_senha.css') }}">
{% endblock %}

{% block content %}

    <div class="recuperar-container">

        <a href="/"><img class="logo-recuperar" src="{{ url_for('static', filename='images/LOGO.png') }}" alt="Logo-OverClock"></a>

        <h1 class="recuperar-titulo">Nova Senha</h1>
        <p> Digite sua nova senha abaixo.</p>

        <form action="#" method="POST" id="form-nova-senha">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="codigo" value="{{ codigo }}">

            <div class="input-group">
                <label for="senha">Nova senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                    placeholder="Sua nova senha"
                >
            </div>

            <div class="input-group">
                <label for="confirmar-senha">Confirmar nova senha:</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    required
                    placeholder="Confirme sua nova senha"
                >
            </div>

            <button type="submit" class="btn-recuperar">Salvar nova senha</button>
            
        </form>

    </div>
{% endblock %}
