{% extends "base.html" %}

{% block style %}
  <link rel="stylesheet" href="../static/css/trocar_senha.css">
{% endblock %}

{% block body %}
<body>
    <div class="recuperar-container">

        <a href="/"><img id="logo" src="../static/images/LOGO.png" alt="Logo-OverClock"></a>

        <h1 class="recuperar-titulo">Nova Senha</h1>
        <p> Digite sua nova senha abaixo.</p>

        <form action="#" method="POST" id="form-nova-senha">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="codigo" value="{{ codigo }}">

            <div class="input-group">
                <label for="senha">Nova senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                    placeholder="Sua nova senha"
                >
            </div>

            <div class="input-group">
                <label for="confirmar-senha">Confirmar nova senha:</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    required
                    placeholder="Confirme sua nova senha"
                >
            </div>

            <button type="submit" class="btn-recuperar">Salvar nova senha</button>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="mensagens-alerta">
                        {% for message in messages %}
                            <p style="color: red; font-weight: bold; text-align: center;">{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
        </form>

    </div>
</body>
{% endblock %}
