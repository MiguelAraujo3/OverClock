{% extends "base.html" %}
{% block title %}Login - OverClock Barbearia{% endblock %}
{%block extra_css%}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{%endblock%}
{% block menu %}{% endblock menu %}
{%block content%}

    <div class="login-container">
        <a href="/"><img class="logo-login" src="{{ url_for('static', filename='images/LOGO.png') }}" alt="Logo-OverClock"></a>
        
        <form action="{{ url_for('login.login') }}" method="POST">
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required placeholder="Sua senha">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
           
            <div class="opcoes-login">
                <a href="{{ url_for('login.recuperar_senha') }}" class="link-secundario">Esqueceu a senha?</a>
                <a href="{{ url_for('cadastro.cadastro') }}" class="link-secundario">Faça seu cadastro</a>
             </div>
        </form>
    </div>

{%endblock%}
</html>
