<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OverClock Barbearia</title>
  <link rel="stylesheet" href="../static/css/login.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
</head>
<body>
    <div class="login-container">
        <a href="#"><img id="logo" src="../static/images/LOGO.png" alt="Logo-OverClock"></a>
        
        <form action="/login" method="POST">
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required placeholder="Sua senha">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
            <div class="opcoes-login">
                <a href="#" class="link-secundario">Esqueceu a senha?</a>
                <a href="cadastro" class="link-secundario">Faça seu cadastro</a>
             </div>
        </form>
    </div>

</body>
</html>
