{% extends "base.html" %}
{% block title %}Login Administrativo - OverClock Barbearia{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login_admin.css') }}">
{% endblock %}
{% block menu %}{% endblock menu %}

{% block content %}

    <div class="login-container">
        <a href="/"><img class="logo-admin" src="{{ url_for('static', filename='images/LOGO.png') }}" alt="Logo-OverClock"></a>
        
        <h1 class="titulo-login-admin">Login Administrativo</h1>

        <form action="{{ url_for('login_admin.login') }}" method="POST">
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required placeholder="Sua senha">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>

{% endblock %}
