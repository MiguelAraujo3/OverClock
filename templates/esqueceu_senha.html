{% extends "base.html" %}
{% block title %}Recuperar Senha - OverClock Barbearia{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/trocar_senha.css') }}">
{% endblock %}

{% block content %}

    <div class="recuperar-container">

        <a href="/"><img class="logo-recuperar" src="{{ url_for('static', filename='images/LOGO.png') }}" alt="Logo-OverClock"></a>

        <h1 class="recuperar-titulo">Recuperar Senha</h1>
        <p class="recuperar-instrucao">
            Digite seu e-mail cadastrado e enviaremos um <span>código de verificação</span>.
        </p>

        <form action="{{ url_for('login.recuperar_senha') }}" method="POST">
            <div class="input-group">
                <label for="email">E-mail cadastrado:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="seu@email.com"
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="btn-recuperar">Enviar código</button>
        </form>
    </div>
{% endblock %}
