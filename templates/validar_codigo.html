{% extends "base.html" %}
{% block title %}Verificar Código - OverClock Barbearia{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/trocar_senha.css') }}">
{% endblock %}
{% block menu %}{% endblock menu %}

{% block content %}

    <div class="recuperar-container">

        <a href="/"><img class="logo-recuperar" src="{{ url_for('static', filename='images/LOGO.png') }}" alt="Logo-OverClock"></a>

        <h1 class="recuperar-titulo">Verificar Código</h1>
        <p>Digite-o abaixo para continuar.</p>

        <form action="{{ url_for('login.validar_codigo') }}" method="POST">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="input-group input-codigo">
                <label for="codigo">Código de verificação:</label>
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    required
                    placeholder="000000"
                    maxlength="6"
                    autocomplete="one-time-code"
                    inputmode="numeric"
                >
            </div>

            <button type="submit" class="btn-recuperar">Confirmar código</button>
    
        </form>

        <div class="reenviar">
            <p>Não recebeu? <a href="{{ url_for('login.recuperar_senha', email=email) }}">Reenviar código</a></p>
        </div>
    </div>
{% endblock %}
