{% extends "base.html" %}
{% block title %}Alterar Senha - OverClock Barbearia{% endblock %}
{% block menu %}{% endblock menu %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/trocar_senha.css') }}">
{% endblock %}

{% block content %}

    <div class="recuperar-container">

        <a href="/"><img class="logo-recuperar" src="{{ url_for('static', filename='images/LOGO.png') }}" alt="Logo-OverClock"></a>

        <h1 class="recuperar-titulo">Alterar Senha</h1>
        <p>Preencha os campos abaixo para atualizar sua senha de acesso.</p>

        <form action="{{ url_for('alterar_senha.alterar_senha') }}" method="POST" id="form-alterar-senha">
            
            <div class="input-group">
                <label for="senha-atual">Senha atual:</label>
                <input
                    type="password"
                    id="senha-atual"
                    name="senha_atual"
                    required
                    placeholder="Digite sua senha atual"
                >
            </div>

            <div class="input-group">
                <label for="nova-senha">Nova senha:</label>
                <input
                    type="password"
                    id="nova-senha"
                    name="nova_senha"
                    required
                    placeholder="Sua nova senha"
                >
            </div>

            <div class="input-group">
                <label for="confirmar-senha">Confirmar nova senha:</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar_senha"
                    required
                    placeholder="Confirme sua nova senha"
                >
            </div>

            <button type="submit" class="btn-recuperar">Salvar nova senha</button>
        </form>
        
    </div>

{% endblock %}
